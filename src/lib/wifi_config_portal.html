<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/portal.css?v={{VERSION}}-assets1">
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div>
        <h1 data-i18n="{{HEADLINE_KEY}}">{{HEADLINE}}</h1>
        <p class="sub" data-i18n="{{INTRO_KEY}}">{{INTRO}}</p>
      </div>
      <div class="status">
        <div><span data-i18n="configAp">Config AP</span><strong class="mono">{{AP_IP}}</strong></div>
        <div><span data-i18n="stationIp">Station IP</span><strong class="mono">{{STA_IP}}</strong></div>
        <div class="language"><span class="lang-label" data-i18n="language">Language</span><div id="language-select" class="lang-radio"><label><input type="radio" name="lang" value="en">English</label><label><input type="radio" name="lang" value="zh">中文</label></div></div>
      </div>
    </div>

    <p class="back-home">{{BACK_HOME}}</p>

    <p class="notice" data-i18n="bootNotice">Hold BOOT for 5 seconds after startup to reset WiFi and server settings.</p>
    <p class="sub"><span data-i18n="firmwareVersion">Firmware version</span> <span class="mono">{{VERSION}}</span></p>

    <script>
<!-- @include wifi_portal_parts/wifi_config_portal_lang_boot.js -->
</script>
    {{HOME_CARDS}}
    {{FORM_SECTIONS}}
    <div class="footer-links">{{FOOTER}}</div>
  </main>
  <script src="/portal.js?v={{VERSION}}-assets1"></script>
</body>
</html>
