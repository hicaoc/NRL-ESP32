<!-- @template DEVICE_SECTIONS -->
<section class="panel">
  <div class="section-head"><h2 data-i18n="server">Server</h2></div>
  <div class="grid">
    <form class="item-form span-2" method="post" action="/save_nrl">
      <div class="subgrid">
        <div><label data-i18n="serverHost">Server Host / IP</label><select id="nrl-server-select" name="server_host"><option value="{{SERVER_HOST}}" data-port="{{SERVER_PORT}}" selected>{{SERVER_HOST}}</option></select><div class="hint" id="nrl-server-current" role="button" tabindex="0">Current NRL server: {{SERVER_HOST}}:{{SERVER_PORT}}</div><div class="hint" id="nrl-server-status" data-i18n="serverListLoading">Loading server list...</div></div>
        <div><label data-i18n="serverPort">Server Port</label><input id="nrl-server-port" name="server_port" value="{{SERVER_PORT}}"></div>
      </div>
      <div class="actions"><button class="btn-small" type="submit" data-i18n="saveItem">Save</button></div>
    </form>
  </div>
</section>
<section class="panel">
  <div class="section-head"><h2 data-i18n="radio">Radio</h2></div>
  <div class="grid">
    <form class="item-form span-2" method="post" action="/save_nrl">
      <div class="subgrid">
        <div{{CHANNEL_HIDDEN}}><label data-i18n="channel">Channel (0-7)</label><input name="channel" value="{{CHANNEL}}"></div>
        <div><label data-i18n="tailSuppressMs">Tail Suppression (ms, 0-5000, 0=off)</label><input name="tail_suppress_ms" value="{{TAIL_SUPPRESS_MS}}"></div>
        <div><label data-i18n="callsign">Callsign</label><input name="callsign" value="{{CALLSIGN}}"></div>
        <div><label data-i18n="callsignSsid">Callsign SSID</label><input name="callsign_ssid" value="{{CALLSIGN_SSID}}"></div>
        <div><label data-i18n="pttTimeout">PTT Timeout (seconds, 5-3600)</label><input name="ptt_timeout" value="{{PTT_TIMEOUT}}"></div>
        <div><label data-i18n="voicePayloadBytes">Voice Packet Size (bytes, 160-500)</label><input name="voice_payload_bytes" value="{{VOICE_PAYLOAD_BYTES}}"></div>
        <div><label data-i18n="voiceCodec">NRL Voice Codec (TX)</label><select name="voice_codec"><option value="0"{{CODEC_G711_SELECTED}} data-i18n="codecG711">G.711 8 kHz (compatible)</option><option value="1"{{CODEC_OPUS_SELECTED}} data-i18n="codecOpus">Opus 16 kHz wideband</option></select></div>
      </div>
      <div class="actions"><button class="btn-small" type="submit" data-i18n="saveItem">Save</button></div>
    </form>
  </div>
</section>{{BATTERY_SECTION}}
<!-- @endtemplate -->

<!-- @template BATTERY_SECTION -->
<section class="panel">
  <div class="section-head"><h2 data-i18n="battery">Battery</h2><span class="hint" data-i18n="batteryHint">Calibrate the on-board battery sense against a multimeter.</span></div>
  <div class="grid">
    <form class="item-form span-2" method="post" action="/save_nrl">
      <div class="subgrid">
        <div><label data-i18n="batteryRaw">Raw reading (mV)</label><input value="{{BATT_RAW_MV}}" readonly tabindex="-1"></div>
        <div><label data-i18n="batteryCalibrated">Calibrated (mV)</label><input value="{{BATT_CAL_MV}}" readonly tabindex="-1"></div>
        <div class="span-2"><label data-i18n="batteryActual">Measured by multimeter (mV) -- click Calibrate to fit the scale to this value</label><input name="battery_actual_mv" value="" placeholder="e.g. 4180"></div>
      </div>
      <div class="actions"><button class="btn-small" type="submit" data-i18n="batteryCalibrate">Calibrate</button></div>
    </form>
    <form class="item-form span-2" method="post" action="/save_nrl">
      <div class="subgrid">
        <div class="span-2"><label data-i18n="batteryScale">Calibration scale (500-2000, where 1000 = no correction)</label><input name="battery_cal_milli" value="{{BATT_CAL_MILLI}}"></div>
      </div>
      <div class="actions"><button class="btn-small" type="submit" data-i18n="saveItem">Save</button></div>
    </form>
  </div>
</section>
<!-- @endtemplate -->
