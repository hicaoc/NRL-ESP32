<!-- @template EQ_SLIDER -->
<form class="item-form eq-control" method="post" action="/save_nrl"><label{{I18N_ATTR}}>{{LABEL}}</label><div class="eq-row"><input class="eq-slider" type="range" min="0" max="{{MAX}}" step="1" name="{{FIELD}}" value="{{VALUE}}" oninput="syncEqValue(this)" onpointerup="submitEqSlider(this)"><input class="eq-value mono" type="text" value="{{HEX_VALUE}}" oninput="syncEqSlider(this)"></div></form>
<!-- @endtemplate -->

<!-- @template AUTO_SLIDER -->
<form class="item-form" method="post" action="/save_nrl"><label{{I18N_ATTR}}>{{LABEL}}</label><div class="eq-row"><input class="auto-slider" type="range" name="{{FIELD}}" min="{{MIN}}" max="{{MAX}}" step="1" value="{{VALUE}}" oninput="syncAutoSliderValue(this)" onpointerup="submitAutoSlider(this)" onchange="syncAutoSliderValue(this)"><input class="eq-value mono" type="number" value="{{VALUE}}" readonly tabindex="-1"></div></form>
<!-- @endtemplate -->

<!-- @template AUTO_NUMBER -->
<form class="item-form" method="post" action="/save_nrl"><label{{I18N_ATTR}}>{{LABEL}}</label><input class="mono" type="number" name="{{FIELD}}" min="{{MIN}}" max="{{MAX}}" step="{{STEP}}" value="{{VALUE}}" onchange="submitSwitch(this)"></form>
<!-- @endtemplate -->

<!-- @template WIFI_OPTION -->
<option value="{{VALUE}}"{{SELECTED}}>{{LABEL}}</option>
<!-- @endtemplate -->
